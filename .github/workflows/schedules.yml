name: Refresh GitHub Stars snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: write

concurrency:
  group: github-stars-sync
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r config/requirements.txt

      # Tests intentionally run before the live publication step. Mock CLI
      # output is isolated under artifacts/test-generated and cannot replace
      # README.md, language.md, or web/data/stars.json.
      - name: Run Robot Framework acceptance tests
        run: python -m robot --outputdir artifacts/robot tests

      - name: Sync Andy87877 public Stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py --username Andy87877

      - name: Verify live snapshot metadata
        run: >-
          python -c "import json, pathlib;
          data=json.loads(pathlib.Path('web/data/sync-meta.json').read_text(encoding='utf-8'));
          assert data['username']=='Andy87877';
          assert data['repositoryCount'] > 0;
          assert data['isLiveSnapshot'] is True"

      - name: Commit changed generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- README.md language.md web/data/stars.json web/data/sync-meta.json; then
            echo "Stars snapshot is already current."
            exit 0
          fi
          COMMIT_TITLE=$(python -c "
          import json, pathlib
          data = json.loads(pathlib.Path('web/data/sync-meta.json').read_text(encoding='utf-8'))
          count = data.get('repositoryCount', 0)
          delta = data.get('formattedDelta', '0')
          ts = data.get('formattedUpdatedAt', data.get('generatedAt', ''))[:19]
          print(f'data: refresh Andy87877 GitHub Stars ({count} stars, delta: {delta} | {ts})')
          ")
          COMMIT_BODY=$(python -c "
          import json, pathlib
          data = json.loads(pathlib.Path('web/data/sync-meta.json').read_text(encoding='utf-8'))
          analytics = data.get('analytics', {})
          total_stars = analytics.get('totalStars', 0)
          top_lang = list(analytics.get('languageBreakdown', {}).keys())[:3]
          top_lang_str = ', '.join(top_lang) if top_lang else 'N/A'
          print(f'Total Repositories: {data.get(\"repositoryCount\")}\nDelta Change: {data.get(\"formattedDelta\")}\nTotal Stars Counted: {total_stars}\nTop Languages: {top_lang_str}\nTimestamp: {data.get(\"formattedUpdatedAt\", data.get(\"generatedAt\"))}')
          ")
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md language.md web/data/stars.json web/data/sync-meta.json
          git commit -m "$COMMIT_TITLE" -m "$COMMIT_BODY"
          git push
