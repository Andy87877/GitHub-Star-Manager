# Robot CI gates the pure-static GitHub Pages deployment.
name: CI and deploy static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Run Robot Framework acceptance tests
        run: python -m robot --outputdir artifacts/robot tests

      - name: Validate publishable snapshot
        run: >-
          python -c "import json, pathlib;
          stars=json.loads(pathlib.Path('web/data/stars.json').read_text(encoding='utf-8'));
          meta=json.loads(pathlib.Path('web/data/sync-meta.json').read_text(encoding='utf-8'));
          assert stars and len(stars)==meta['repositoryCount'];
          assert meta['username']=='Andy87877';
          assert meta['isLiveSnapshot'] is True;
          assert pathlib.Path('web/index.html').is_file()"

      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-${{ github.run_id }}
          path: artifacts/robot
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6

      - name: Prepare static site artifact
        shell: bash
        run: |
          mkdir -p _site
          cp -R web/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
